  <text x="40" y="690" font-size="11" fill="#8a94a1">M2·1  memory.py — ContextWindow added: append · token_count · trim (system sacred, oldest evicted first)</text>
  <text x="40" y="706" font-size="11" fill="#8a94a1">M2·3  agent.py — Agent constructed: full hop Task→Memory→Brain→reply-stored · loop seam + max_steps guard</text>
  <text x="40" y="722" font-size="11" fill="#8a94a1">M2·5  run.py — CLI now agent-driven: —max-steps + —script flags · memory gauges · answer/outcome result block</text>
  <text x="40" y="738" font-size="11" fill="#8a94a1">M2·6  close-out — PLAN.md flip · timeline.html slideshow · final narrated run · journey.gif</text>
  <text x="40" y="754" font-size="11" fill="#8a94a1">M3·1  tool.py — the hand's shape: Tool(name · description · schema · func) · ToolCall · ToolResult · lab/tool_lab.py</text>
  <text x="40" y="770" font-size="11" fill="#8a94a1">M3·2  registry.py — the phonebook + manual page: dup→ValueError · miss→None · sorted names · catalogue rendered FROM the schema</text>
  <text x="40" y="786" font-size="11" fill="#8a94a1">M3·3  asa/tools/ — calculator (pure, hand parser, no eval, length+depth guards) · clock (read-only, optional utc) · lab/tools_lab.py</text>
  <text x="40" y="802" font-size="11" fill="#8a94a1">M3·4  stateful pair — notes (numbered ledger ×2) + plan-board (stable ids ×3): world is data OUTSIDE the hands · lab/state_lab.py</text>
  <text x="40" y="818" font-size="11" fill="#8a94a1">M3·5  agent wiring — default_tools() (one fresh world per agent) · catalogue pasted into the system prompt · run.py --no-tools</text>
