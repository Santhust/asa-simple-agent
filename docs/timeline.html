<header><strong>asa — the journey in pictures · M1 → M3 (complete)</strong><span id="idx"></span></header>
<div class="deck">
<figure class="slide" data-idx="1"><img src="frames/m1-stage-00.png" alt="stage 1"><figcaption>M1 — the shell: run.py → Message → Brain (→ MockBrain) → Completion → Narrator</figcaption></figure><figure class="slide" data-idx="2"><img src="frames/m2-stage-01.png" alt="stage 2"><figcaption>M2·1 — memory: a ContextWindow appears (token-budgeted transcript; system sacred, oldest evicted first)</figcaption></figure><figure class="slide" data-idx="3"><img src="frames/m2-stage-03.png" alt="stage 3"><figcaption>M2·3 — agent: a full hop Task→Memory→Brain→reply-stored, the loop seam + max_steps guard</figcaption></figure><figure class="slide" data-idx="4"><img src="frames/m2-stage-05.png" alt="stage 4"><figcaption>M2·5 — CLI: run.py becomes the mouthpiece (narrated memory gauges, answer/outcome result block)</figcaption></figure><figure class="slide" data-idx="5"><img src="frames/m2-stage-06.png" alt="stage 5"><figcaption>M2 close-out — the loop skeleton is complete; next up M3 tools &amp; registry</figcaption></figure><figure class="slide" data-idx="6"><img src="frames/m3-stage-01.png" alt="stage 6"><figcaption>M3·1 — the hand gets a shape: Tool(data + func) · ToolCall · ToolResult, with failure as data</figcaption></figure><figure class="slide" data-idx="7"><img src="frames/m3-stage-02.png" alt="stage 7"><figcaption>M3·2 — the phonebook + the manual page: ToolRegistry (dup→ValueError · miss→None · sorted) and a catalogue rendered FROM the schema</figcaption></figure><figure class="slide" data-idx="8"><img src="frames/m3-stage-03.png" alt="stage 8"><figcaption>M3·3 — the first real hands: calculator (pure, hand parser, no eval, length+depth guards) + clock (read-only, optional utc)</figcaption></figure><figure class="slide" data-idx="9"><img src="frames/m3-stage-04.png" alt="stage 9"><figcaption>M3·4 — the stateful pair: notes (numbered ledger, ×2 hands) + plan-board (stable ids, ×3 hands); state lives OUTSIDE the hands in injected stores</figcaption></figure><figure class="slide" data-idx="10"><img src="frames/m3-stage-05.png" alt="stage 10"><figcaption>M3·5 — the wiring: default_tools() builds one fresh world per agent, and the catalogue (the model&#x27;s manual page) rides the system prompt — the loop still cannot act</figcaption></figure><figure class="slide" data-idx="11"><img src="frames/m3-stage-06.png" alt="stage 11"><figcaption>M3 close-out — tools &amp; registry complete: 7 hands, a catalogue in the prompt, one fresh world per agent; the parser is M4&#x27;s job</figcaption></figure>
</div>
<div class="nav"><button id="prev" type="button">← prev</button><button id="next" type="button">next →</button></div>
<script>let i=1;const s=document.querySelectorAll('.slide');const nav=()=>{s.forEach(f=>f.style.display=f.dataset.idx==i?'block':'none');document.getElementById('idx').textContent='stage '+i+' / '+s.length;document.getElementById('prev').disabled=i===1;document.getElementById('next').disabled=i===s.length;};const go=d=>{i=Math.min(Math.max(1,i+d),s.length);nav();};document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(-1);if(e.key==='ArrowRight')go(1);});document.getElementById('prev').onclick=()=>go(-1);document.getElementById('next').onclick=()=>go(1);nav();</script>
